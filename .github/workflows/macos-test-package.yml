name: Build macOS Apple Silicon test package

on:
  push:
    branches: ['codex/geoport-lite-macos-arm64']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          architecture: arm64
      - name: Install hash-locked application and build dependencies
        run: python -m pip install --require-hashes -r requirements.lock -r packaging/requirements-build.lock
      - name: Run native regression tests
        run: python -m unittest discover -s tests -v
      - name: Build, verify and package native app
        run: bash packaging/macos/build.sh
      - name: Upload test DMG and checksum
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: GeoPort-Lite-macOS-15-arm64-test
          path: |
            dist/GeoPort-Lite-macOS-15-arm64-test.dmg
            dist/GeoPort-Lite-macOS-15-arm64-test.dmg.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
